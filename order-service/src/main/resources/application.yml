server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5455/order_db
    username: order_user
    password: order_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9094

services:
  payment:
    base-url: http://localhost:8082
  inventory:
    base-url: http://localhost:8083
