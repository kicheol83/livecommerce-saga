server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5455/order_db
    username: order_user
    password: order_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/order
  kafka:
    bootstrap-servers: localhost:9094

saga:
  step-timeout-seconds: 20
  max-step-retries: 3
  recovery-interval-ms: 5000

services:
  payment:
    base-url: http://localhost:8082
  inventory:
    base-url: http://localhost:8083

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
