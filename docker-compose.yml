services:
  postgres-order:
    image: postgres:16
    container_name: postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5455:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - livecommerce_network

  postgres-payment:
    image: postgres:16
    container_name: postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5456:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - livecommerce_network

  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5457:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    networks:
      - livecommerce_network

  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5458:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - livecommerce_network

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - livecommerce_network

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.15.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - livecommerce_network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order_db
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_PAYMENT_BASE-URL: http://payment-service:8082
      SERVICES_INVENTORY_BASE-URL: http://inventory-service:8083
    ports:
      - "8081:8081"
    depends_on:
      - postgres-order
      - kafka
    networks:
      - livecommerce_network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      - postgres-payment
      - kafka
    networks:
      - livecommerce_network

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      - postgres-inventory
      - kafka
    networks:
      - livecommerce_network

  live-service:
    build:
      context: .
      dockerfile: live-service/Dockerfile
    container_name: live-service
    restart: unless-stopped
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICES_INVENTORY_BASE-URL: http://inventory-service:8083
      SERVICES_AUTH_JWK-SET-URI: http://auth-service:8085/.well-known/jwks.json
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - inventory-service
    networks:
      - livecommerce_network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8085:8085"
    depends_on:
      - postgres-auth
    networks:
      - livecommerce_network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SERVICES_AUTH_URL: http://auth-service:8085
      SERVICES_ORDER_URL: http://order-service:8081
      SERVICES_ORDER_WS-URL: ws://order-service:8081
      SERVICES_LIVE_URL: http://live-service:8084
      SERVICES_LIVE_WS-URL: ws://live-service:8084
      SERVICES_PAYMENT_URL: http://payment-service:8082
      SERVICES_INVENTORY_URL: http://inventory-service:8083
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - order-service
      - live-service
    networks:
      - livecommerce_network

networks:
  livecommerce_network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_order_data:
  postgres_payment_data:
  postgres_inventory_data:
